version: '3.8'

services:
  products_db:
    image: postgres:15
    container_name: postgres_products
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  test_products_db:
    image: postgres:15
    container_name: postgres_test_products
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_products
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: redis_products
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
  web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - products_db
      - redis
volumes:
  postgres_data:
  postgres_test_data:
  redis_data: